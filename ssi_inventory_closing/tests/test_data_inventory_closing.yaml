scenarios:
  - name: "Inventory Closing Type - Basic CRUD"
    steps:
      - step: "Find general journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "=", "general"]
        save_as: "journal"
        limit: 1

      - step: "Create inventory closing type"
        action: "create"
        model: "inventory_closing_type"
        save_as: "closing_type"
        values:
          name: "Test Closing Type IC"
          code: "TCIC"
          journal_id: "EVAL: registry['journal'].id"
          product_selection_method: "manual"
          product_category_selection_method: "manual"
          picking_type_selection_method: "manual"
          picking_type_category_selection_method: "manual"

      - step: "Assert closing type created"
        action: "assert"
        target: "closing_type"
        asserts:
          name:
            type: "value"
            expected: "Test Closing Type IC"
          active:
            type: "value"
            expected: true

  - name: "Inventory Closing - Full Workflow: draft to done"
    steps:
      - step: "Find general journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "=", "general"]
        save_as: "journal"
        limit: 1

      - step: "Create inventory closing type"
        action: "create"
        model: "inventory_closing_type"
        save_as: "closing_type"
        values:
          name: "Test IC Type Full Workflow"
          code: "TICFW"
          journal_id: "EVAL: registry['journal'].id"
          product_selection_method: "manual"
          product_category_selection_method: "manual"
          picking_type_selection_method: "manual"
          picking_type_category_selection_method: "manual"

      - step: "Create inventory closing in draft"
        action: "create"
        model: "inventory_closing"
        save_as: "closing"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['closing_type'].id"
          journal_id: "EVAL: registry['journal'].id"
          date: "2024-01-31"
          date_start: "2024-01-01"
          date_end: "2024-01-31"

      - step: "Assert closing is in draft state"
        action: "assert"
        target: "closing"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Reload stock moves (no moves expected)"
        action: "call"
        target: "closing"
        method: "action_reload_stock_move"
        as_user: "base.user_admin"

      - step: "Invalidate cache after reload"
        action: "call"
        target: "closing"
        method: "invalidate_cache"

      - step: "Confirm inventory closing"
        action: "call"
        target: "closing"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "closing"
        method: "invalidate_cache"

      - step: "Mark as done (bypass approval)"
        action: "call"
        target: "closing"
        method: "action_done"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Inventory Closing - Workflow: draft to cancel"
    steps:
      - step: "Find general journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "=", "general"]
        save_as: "journal"
        limit: 1

      - step: "Create inventory closing type"
        action: "create"
        model: "inventory_closing_type"
        save_as: "closing_type"
        values:
          name: "Test IC Type Cancel"
          code: "TICC"
          journal_id: "EVAL: registry['journal'].id"
          product_selection_method: "manual"
          product_category_selection_method: "manual"
          picking_type_selection_method: "manual"
          picking_type_category_selection_method: "manual"

      - step: "Create inventory closing in draft"
        action: "create"
        model: "inventory_closing"
        save_as: "closing"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['closing_type'].id"
          journal_id: "EVAL: registry['journal'].id"
          date: "2024-02-29"
          date_start: "2024-02-01"
          date_end: "2024-02-29"

      - step: "Confirm inventory closing"
        action: "call"
        target: "closing"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Cancel inventory closing"
        action: "call"
        target: "closing"
        method: "action_cancel"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Restart cancelled inventory closing"
        action: "call"
        target: "closing"
        method: "action_restart"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "draft"
