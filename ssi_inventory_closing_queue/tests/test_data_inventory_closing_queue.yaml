scenarios:
  - name: "Inventory Closing Queue - Workflow: draft to confirm"
    steps:
      - step: "Find general journal"
        action: "search"
        model: "account.journal"
        domain:
          - ["type", "=", "general"]
        save_as: "journal"
        limit: 1

      - step: "Create inventory closing type"
        action: "create"
        model: "inventory_closing_type"
        save_as: "closing_type"
        values:
          name: "Test IC Queue Type"
          code: "TICQ"
          journal_id: "EVAL: registry['journal'].id"
          product_selection_method: "manual"
          product_category_selection_method: "manual"
          picking_type_selection_method: "manual"
          picking_type_category_selection_method: "manual"

      - step: "Create inventory closing in draft"
        action: "create"
        model: "inventory_closing"
        save_as: "closing"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['closing_type'].id"
          journal_id: "EVAL: registry['journal'].id"
          date: "2024-03-31"
          date_start: "2024-03-01"
          date_end: "2024-03-31"

      - step: "Assert closing is in draft state"
        action: "assert"
        target: "closing"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm inventory closing"
        action: "call"
        target: "closing"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "closing"
        method: "invalidate_cache"

      - step: "Cancel inventory closing"
        action: "call"
        target: "closing"
        method: "action_cancel"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "cancel"
